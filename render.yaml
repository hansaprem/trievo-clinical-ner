services:
  - type: web
    name: trievo-clinical-ner-backend
    runtime: python
    region: oregon
    plan: starter  # Requires >= 1GB RAM to safely host all 4 PubMedBERT models concurrently
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEVICE
        value: cpu
      - key: MODELS_DIR
        value: models
      - key: HF_MODEL_NAMESPACE
        value: hansaprem703
      - key: FRONTEND_ORIGIN
        sync: false
